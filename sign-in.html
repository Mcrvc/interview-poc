<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Akagikay Interview AI Assistant — local presentation prototype.">
  <title>Sign in · Akagikay</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/data.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body data-page="sign-in">
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="auth-page">
    <section class="auth-brand" aria-label="Akagikay Interview AI Assistant">
      <img class="decor decor-top" src="assets/decor-top.svg" alt="" aria-hidden="true">
      <img class="decor decor-bottom" src="assets/decor-bottom.svg" alt="" aria-hidden="true">
      <div class="auth-brand-content">
        <div class="brand"><img src="assets/logo.svg" alt=""><span>Akagikay</span></div>
        <h1>Your AI Interview Assistant</h1>
        <p class="tagline">Enhance your career with AI</p>
      </div>
    </section>
    <main class="auth-panel" id="main">
      <form class="auth-form" id="sign-in-form" action="dashboard.html">
        <h2>Log in into your account</h2>
        <p class="auth-switch">Dont have an account?, <a class="text-link" href="sign-up.html">Sign up</a></p>
        <div class="field"><label for="username">Username</label><input id="username" autocomplete="username" placeholder="Username" value="Eric Arthur Blair" required maxlength="60"></div>
        <div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="off" placeholder="Password" value="demo1234" required></div>
        <p class="form-error" id="auth-error" role="alert" hidden></p>
        <button class="btn btn-wide" type="submit">Sign in <span aria-hidden="true">→</span></button>
      </form>
      <p class="auth-foot">Interview AI Assistant · Team 6</p>
    </main>
  </div>
</body>
</html>
