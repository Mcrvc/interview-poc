<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign up · Akagikay</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/data.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body data-page="sign-up">
<a class="skip-link" href="#main">Skip to content</a>
<div class="auth-page">
<section class="auth-brand" aria-label="Akagikay Interview AI Assistant">
<img class="decor decor-top" src="assets/decor-top.svg" alt=""><img class="decor decor-bottom" src="assets/decor-bottom.svg" alt="">
<div class="auth-brand-content"><div class="brand"><img src="assets/logo.svg" alt=""><span>Akagikay</span></div><h1>Your AI Interview Assistant</h1><p class="tagline">Enhance your career with AI</p></div>
</section>
<main class="auth-panel" id="main">
<form class="auth-form" id="sign-up-form" action="dashboard.html">
<h2>Create your account</h2><p class="auth-switch">Already have an account?, <a class="text-link" href="sign-in.html">Sign in</a></p>
<div class="field"><label for="username">Username</label><input id="username" type="text" required maxlength="60" autocomplete="username" placeholder="Username"></div>
<div class="field"><label for="password">Password</label><input id="password" type="password" required autocomplete="off" placeholder="Password"></div>
<div class="field"><label for="confirm-password">Confirm Password</label><input id="confirm-password" type="password" required autocomplete="off" placeholder="Confirm Password"></div>
<p class="form-error" id="auth-error" role="alert" hidden></p>
<button class="btn btn-wide" type="submit">Sign up <span aria-hidden="true">→</span></button>
</form><p class="auth-foot">Interview AI Assistant · Team 6</p></main>
</div></body></html>
